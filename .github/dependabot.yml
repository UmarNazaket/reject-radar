version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint', '@angular-eslint/*']
      nx:
        patterns: ['nx', '@nx/*']
      nestjs:
        patterns: ['@nestjs/*']
    ignore:
      # @nx/webpack 23 accepts only webpack-dev-server ^5; npm 10 (Cloudflare Pages) refuses to install 6.
      # Remove once @nx/webpack's peer range includes 6.
      - dependency-name: webpack-dev-server
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
