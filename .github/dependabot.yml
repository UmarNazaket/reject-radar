version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint', '@angular-eslint/*']
      nx:
        patterns: ['nx', '@nx/*']
      nestjs:
        patterns: ['@nestjs/*']
    ignore:
      # @nx/webpack 23 accepts only webpack-dev-server ^5; the npm 11.8 in Cloudflare Pages and Render refuses 6.
      # Remove once @nx/webpack's peer range includes 6.
      - dependency-name: webpack-dev-server
        update-types: ['version-update:semver-major']
      # @nx/nest 23 accepts only @nestjs/common and @nestjs/core <12. Remove once Nx 24 is stable.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
