version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint', '@angular-eslint/*']
      nx:
        patterns: ['nx', '@nx/*']
      nestjs:
        patterns: ['@nestjs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
