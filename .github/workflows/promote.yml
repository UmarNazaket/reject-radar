name: Promote to production

# Production (Render and Cloudflare Pages) deploys the `release` branch. This moves `release` forward to a commit on
# `main` whose CI passed; it never rewinds or rewrites it. Run it after checking the commit on staging.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit on main to release (default: the newest)'
        required: false
        default: ''

permissions:
  contents: write
  checks: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse --verify "${REF:-origin/main}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=verify" --jq '.check_runs[0].conclusion // "missing"')
          [ "$ci" = success ] || { echo "::error::CI (verify) on $sha is $ci"; exit 1; }
          if git rev-parse -q --verify origin/release > /dev/null; then
            git merge-base --is-ancestor origin/release "$sha" || { echo "::error::release has commits that $sha does not"; exit 1; }
          fi
          git push origin "$sha:refs/heads/release"
          echo "Released $(git log -1 --format='%h %s' "$sha")" >> "$GITHUB_STEP_SUMMARY"
