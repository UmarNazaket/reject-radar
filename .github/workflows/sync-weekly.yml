name: Sync weekly

on:
  schedule:
    # FDA charge codes and refusals. Daily for the first week, to find the day FDA publishes new refusals
    # (rows_inserted in source_sync_run); then weekly, on the day after it. By 08:00 the daily 03:07 run and
    # Monday's 06:30 run have ended even at their job timeouts, so this one never waits as a pending run.
    - cron: '0 8 * * *'
    - cron: '30 6 * * 1' # UK border notifications, then Australian IFIS
  workflow_dispatch:
    inputs:
      job:
        description: Job to run on a manual dispatch
        type: choice
        required: true
        default: all
        options:
          - all
          - fda
          - uk-bn
          - au-ifis

permissions:
  contents: read

# One writer at a time on the shared database. GitHub keeps only one pending run per group,
# so scheduled workflows are spaced far apart and chain their jobs with needs.
concurrency:
  group: ingest-db
  cancel-in-progress: false

# Secrets are given only to the steps that run the CLI, never to npm ci or the build.
jobs:
  fda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.schedule == '0 8 * * *' || inputs.job == 'all' || inputs.job == 'fda' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx nx build ingest
      - name: Check database size
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js db:size-check
      - name: sync:fda-charge-codes
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js sync:fda-charge-codes
      - name: sync:fda-refusals
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
          FDA_API_USER: ${{ secrets.FDA_API_USER }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
        run: node dist/apps/ingest/main.js sync:fda-refusals
      # P3: entities:link
      # P5: alerts:run

  uk-bn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: fda
    if: ${{ !cancelled() && (github.event.schedule == '30 6 * * 1' || inputs.job == 'all' || inputs.job == 'uk-bn') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx nx build ingest
      - name: Check database size
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js db:size-check
      - name: sync:uk-bn
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js sync:uk-bn
      # P3: entities:link
      # P5: alerts:run

  au-ifis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: uk-bn
    if: ${{ !cancelled() && (github.event.schedule == '30 6 * * 1' || inputs.job == 'all' || inputs.job == 'au-ifis') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx nx build ingest
      - name: Check database size
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js db:size-check
      - name: sync:au-ifis
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js sync:au-ifis
      # P3: entities:link
      # P5: alerts:run
