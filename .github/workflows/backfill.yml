name: Backfill

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to load. import_alerts must run inside 03:00-09:00 UTC (FDA robots.txt visiting hours). A long backfill that spans a scheduled sync time can make a pending scheduled run be dropped, because GitHub keeps one pending run per concurrency group."
        type: choice
        required: true
        options:
          - fda_charge_codes
          - fda_refusals
          - import_alerts
          - rasff
          - uk_bn
          - au_ifis
          - eu_mrl
          - taxonomy_remap
          - entities
          - summaries
          - summary_translations
      from:
        description: Earliest date to load, YYYY-MM-DD (fda_refusals and rasff; blank uses the command default)
        type: string
        required: false
        default: ''
      details_limit:
        description: "Most RASFF notification details to fetch in this run (rasff only). About 6000 fit the 350-minute timeout at 1 request a second; run again for the rest."
        type: string
        required: false
        default: '6000'

permissions:
  contents: read

# One writer at a time on the shared database.
concurrency:
  group: ingest-db
  cancel-in-progress: false

# Secrets are given only to the steps that run the CLI, never to npm ci or the build.
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx nx build ingest
      - name: Check database size
        id: size
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js db:size-check
      - name: Run the sync
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
          FDA_API_USER: ${{ secrets.FDA_API_USER }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
          SOURCE: ${{ inputs.source }}
          FROM: ${{ inputs.from }}
          DETAILS_LIMIT: ${{ inputs.details_limit }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          if [ -n "$FROM" ] && ! printf '%s' "$FROM" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "from must be YYYY-MM-DD, got: $FROM" >&2
            exit 1
          fi
          if ! printf '%s' "$DETAILS_LIMIT" | grep -Eq '^[1-9][0-9]*$'; then
            echo "details_limit must be a positive whole number, got: $DETAILS_LIMIT" >&2
            exit 1
          fi
          from_args=()
          if [ -n "$FROM" ]; then from_args=(--from "$FROM"); fi
          cli=(node dist/apps/ingest/main.js)
          case "$SOURCE" in
            fda_charge_codes) "${cli[@]}" sync:fda-charge-codes --no-events ;;
            fda_refusals)     "${cli[@]}" sync:fda-refusals "${from_args[@]}" --no-events ;;
            import_alerts)    "${cli[@]}" sync:import-alerts --no-events ;;
            rasff)            "${cli[@]}" sync:rasff "${from_args[@]}" --details-limit "$DETAILS_LIMIT" --no-events ;;
            uk_bn)            "${cli[@]}" sync:uk-bn --no-events ;;
            au_ifis)          "${cli[@]}" sync:au-ifis --no-events ;;
            eu_mrl)           "${cli[@]}" sync:eu-mrl --no-events ;;
            taxonomy_remap)   "${cli[@]}" taxonomy:remap ;;
            entities)         "${cli[@]}" entities:link ;;
            summaries)        "${cli[@]}" summaries:draft --limit 1000 ;;
            summary_translations) "${cli[@]}" summaries:translate --limit 3000 ;;
            *) echo "unknown source: $SOURCE" >&2; exit 1 ;;
          esac
      # A page-structure failure saves the page under INGEST_FAILURE_DIR (default tmp/ingest-failures).
      - name: Upload the page that failed to parse
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ingest-failures-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ingest-failures
          if-no-files-found: ignore
          retention-days: 30
      # The firm-level sources add records that no firm is linked to yet, and taxonomy_remap changes the commodities and
      # hazards that firm facts are built from. Like the scheduled syncs, this links even after a failed "Run the sync"
      # step, as the rows already stored still need their firms and facts; the job still fails. It does not run after a
      # failed "Check database size" step: linking writes too, so the 900 MB limit stops it as well (the command checks
      # it again). The entities source runs this command alone, in the "Run the sync" step, which a failed size check
      # skips too.
      - name: entities:link
        if: ${{ !cancelled() && steps.size.outcome == 'success' && (inputs.source == 'fda_refusals' || inputs.source == 'import_alerts' || inputs.source == 'au_ifis' || inputs.source == 'taxonomy_remap') }}
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js entities:link
