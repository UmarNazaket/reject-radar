name: Sync monthly

on:
  schedule:
    - cron: '30 3 1 * *' # EU MRL
  workflow_dispatch:

permissions:
  contents: read

# One writer at a time on the shared database.
concurrency:
  group: ingest-db
  cancel-in-progress: false

jobs:
  eu-mrl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
      FDA_API_USER: ${{ secrets.FDA_API_USER }}
      FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx nx build ingest
      - name: Check database size
        run: node dist/apps/ingest/main.js db:size-check
      - name: sync:eu-mrl
        run: node dist/apps/ingest/main.js sync:eu-mrl
      # P3: entities:link
      # P5: alerts:run
