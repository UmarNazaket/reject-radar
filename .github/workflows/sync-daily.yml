name: Sync daily

on:
  schedule:
    # Import Alerts, then RASFF. A full Import Alert crawl must start inside FDA's robots.txt visiting hours, 03:00-09:00
    # UTC, and GitHub can start a scheduled run hours late (the 03:07 one has started between 08:53 and 09:54). So Import
    # Alerts alone is also due at 23:37: with a delay of 0 to 5.8 hours the 03:07 run starts inside the hours, with 3.4 to
    # 9.3 hours the 23:37 one does. A scheduled crawl outside them, or after one succeeded that UTC day, skips (--if-due).
    # One extra run only: the sync workflows share a concurrency group, which keeps one pending run.
    - cron: '7 3 * * *'
    - cron: '37 23 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run on a manual dispatch (import-alerts must be dispatched inside 03:00-09:00 UTC)"
        type: choice
        required: true
        default: all
        options:
          - all
          - import-alerts
          - rasff

permissions:
  contents: read

# One writer at a time on the shared database. GitHub keeps only one pending run per group,
# so scheduled workflows are spaced far apart and chain their jobs with needs.
concurrency:
  group: ingest-db
  cancel-in-progress: false

# Secrets are given only to the steps that run the CLI, never to npm ci or the build.
jobs:
  import-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'import-alerts' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx nx build ingest
      - name: Check database size
        id: size
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js db:size-check
      - name: sync:import-alerts
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js sync:import-alerts ${{ github.event_name == 'schedule' && '--if-due' || '' }}
      # A page-structure failure saves the page under INGEST_FAILURE_DIR (default tmp/ingest-failures).
      - name: Upload the page that failed to parse
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ingest-failures-import-alerts-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ingest-failures
          if-no-files-found: ignore
          retention-days: 30
      # Runs even after a failed sync, so that records stored earlier still get their firms and firm facts still age.
      # Not after a failed size check: it writes too, so the 900 MB limit stops it as well (the command checks it again).
      - name: entities:link
        if: ${{ !cancelled() && steps.size.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js entities:link
      # Runs even after a failed step, so that events already stored still become alerts. It exits 3 when a
      # firm-level event has stayed unlinked for 48 hours (the cursor waits behind it), which emails the owner.
      - name: alerts:run
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          MAIL_TRANSPORT: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NODE_ENV: production
        run: node dist/apps/ingest/main.js alerts:run
      # Last, so a Claude outage never delays alerts. Drafts wait for a person; only approved English is translated.
      - name: summaries:draft
        if: ${{ !cancelled() && steps.size.outcome == 'success' }}
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: node dist/apps/ingest/main.js summaries:draft
      - name: summaries:translate
        if: ${{ !cancelled() && steps.size.outcome == 'success' }}
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: node dist/apps/ingest/main.js summaries:translate

  rasff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: import-alerts
    if: ${{ !cancelled() && (github.event.schedule == '7 3 * * *' || inputs.job == 'all' || inputs.job == 'rasff') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx nx build ingest
      - name: Check database size
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js db:size-check
      - name: sync:rasff --details-limit 200
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js sync:rasff --details-limit 200
      # Runs even after a failed step, so that events already stored still become alerts. It exits 3 when a
      # firm-level event has stayed unlinked for 48 hours (the cursor waits behind it), which emails the owner.
      - name: alerts:run
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          MAIL_TRANSPORT: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NODE_ENV: production
        run: node dist/apps/ingest/main.js alerts:run
      # Last, after every sync: re-applies the taxonomy rules when staff asked for it on the admin screen (P10).
      - name: taxonomy:remap --if-requested
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
        run: node dist/apps/ingest/main.js taxonomy:remap --if-requested
