name: Migrate database

# Applies the migrations in libs/db/migrations that the database behind INGEST_DATABASE_URL has not run yet, in order;
# ones already applied are skipped, so running it again changes nothing. That secret is the direct connection string
# of staging until launch, then of production (README: "Launch runbook").
on:
  workflow_dispatch:

permissions:
  contents: read

# The sync workflows' group: a migration waits for a running sync instead of locking tables under it.
concurrency:
  group: ingest-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: npx drizzle-kit migrate --config=libs/db/drizzle.config.ts
      - name: Count applied migrations
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: |
          applied=$(psql "$DATABASE_URL" -Atc 'select count(*) from drizzle.__drizzle_migrations')
          files=$(ls libs/db/migrations/*.sql | wc -l)
          echo "Applied $applied of $files migrations" >> "$GITHUB_STEP_SUMMARY"
          [ "$applied" = "$files" ] || { echo "::error::$applied of $files migrations applied"; exit 1; }
