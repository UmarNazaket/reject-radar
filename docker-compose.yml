services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rejectradar
      POSTGRES_PASSWORD: rejectradar
      POSTGRES_DB: rejectradar
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rejectradar']
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI + API
volumes:
  pgdata:
